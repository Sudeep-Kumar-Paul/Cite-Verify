services:
  - type: web
    name: citeverify-backend
    runtime: python
    rootDir: citeverify-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health
